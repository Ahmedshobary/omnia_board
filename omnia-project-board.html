<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omnia Jewelry — Project Board</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --navy:#16233f; --navy2:#1d2c4d; --gold:#b28b3c; --gold-lt:#d4b878;
    --bg:#f4f5f7; --card:#fff; --line:#e4e7ec; --txt:#2b2f3a; --muted:#8b8fa0;
  }
  body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--txt);padding:24px;min-height:100vh;}
  .wrap{max-width:1280px;margin:0 auto;}

  header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;border-radius:10px;padding:24px 28px;margin-bottom:18px;position:relative;}
  .eyebrow{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold-lt);margin-bottom:8px;}
  header h1{font-size:24px;font-weight:600;margin-bottom:4px;}
  header h1 span{color:var(--gold-lt);}
  .sub{font-size:12.5px;color:#c8cfdd;font-weight:300;}
  .langtog{position:absolute;top:22px;right:26px;display:flex;gap:0;border:1px solid rgba(255,255,255,.25);border-radius:6px;overflow:hidden;}
  .langtog button{background:transparent;border:0;color:#c8cfdd;font-family:inherit;font-size:11px;font-weight:600;padding:6px 12px;cursor:pointer;letter-spacing:.5px;}
  .langtog button.on{background:var(--gold);color:#fff;}

  .bar-wrap{margin-top:18px;}
  .bar-top{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:#c8cfdd;margin-bottom:7px;}
  .bar-top b{color:#fff;font-size:15px;font-weight:600;}
  .bar{height:7px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--gold-lt));border-radius:4px;transition:width .45s ease;}

  .phases{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .ptab{border:1px solid var(--line);background:#fff;color:var(--muted);padding:9px 18px;border-radius:8px;font-size:12px;font-family:inherit;font-weight:500;cursor:pointer;transition:.15s;}
  .ptab:hover{border-color:var(--gold);color:var(--gold);}
  .ptab.on{background:var(--navy);border-color:var(--navy);color:#fff;}
  .ptab .mini{display:block;font-size:9.5px;font-weight:400;opacity:.7;margin-top:1px;}

  .filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px;}
  .chip{border:1px solid var(--line);background:#fff;color:var(--muted);padding:6px 13px;border-radius:20px;font-size:11.5px;font-family:inherit;cursor:pointer;transition:.15s;font-weight:500;}
  .chip:hover{border-color:var(--gold);color:var(--gold);}
  .chip.on{background:var(--navy);border-color:var(--navy);color:#fff;}

  .hint{font-size:11px;color:var(--muted);margin-bottom:14px;}

  .board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start;}
  .col{background:#eceef1;border-radius:10px;padding:14px;min-height:180px;}
  .col-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:2px solid #dcdfe4;}
  .col-title{font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;}
  .col-count{background:#fff;color:var(--muted);font-size:11px;font-weight:600;padding:2px 9px;border-radius:11px;}
  .col.todo .col-title{color:#7a8190;}
  .col.doing .col-title{color:var(--gold);}
  .col.done .col-title{color:#3f8f5f;}
  .col.doing{background:#f7f2e8;}
  .col.done{background:#eef6f1;}

  .card{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:7px;padding:11px 12px;margin-bottom:9px;cursor:pointer;transition:.15s;position:relative;}
  .card:hover{box-shadow:0 3px 10px rgba(22,35,63,.11);transform:translateY(-1px);}
  .card.p-crit{border-left-color:#c0453f;}
  .card.p-cat{border-left-color:#d08a2c;}
  .card.p-cont{border-left-color:#c9b23f;}
  .card.p-pol{border-left-color:#9aa1ae;}
  .card.p-sys{border-left-color:#3f7fa8;}
  .card-num{font-size:10px;color:var(--muted);font-weight:600;}
  .card-title{font-size:12.5px;font-weight:500;line-height:1.42;margin:3px 0 8px;}
  .card.is-done .card-title{text-decoration:line-through;color:var(--muted);}
  .tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
  .tag{font-size:9.5px;padding:2.5px 7px;border-radius:9px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;}
  .t-crit{background:#fbeceb;color:#c0453f;}
  .t-cat{background:#fdf1e2;color:#a86a12;}
  .t-cont{background:#faf6e0;color:#8a7a14;}
  .t-pol{background:#f0f1f3;color:#71778a;}
  .t-sys{background:#e8f1f7;color:#2c6a8f;}
  .who{font-size:9.5px;padding:2.5px 7px;border-radius:9px;font-weight:600;background:#eef1f7;color:#5a6478;letter-spacing:.3px;}
  .who.blocked{background:#fdeceb;color:#b3392f;}

  .move{position:absolute;right:9px;bottom:9px;display:flex;gap:4px;opacity:0;transition:.15s;}
  .card:hover .move{opacity:1;}
  .move button{width:21px;height:21px;border:1px solid var(--line);background:#fff;border-radius:5px;cursor:pointer;font-size:11px;color:var(--muted);line-height:1;font-family:inherit;}
  .move button:hover{background:var(--navy);color:#fff;border-color:var(--navy);}
  .empty{text-align:center;color:#a8aeba;font-size:11.5px;padding:22px 0;font-style:italic;}

  .foot{margin-top:22px;padding-top:14px;border-top:1px solid #dfe2e7;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);flex-wrap:wrap;gap:10px;}
  .foot b{color:var(--gold);}
  .reset{border:1px solid var(--line);background:#fff;color:var(--muted);padding:6px 13px;border-radius:6px;font-size:11px;cursor:pointer;font-family:inherit;}
  .reset:hover{border-color:#c0453f;color:#c0453f;}

  @media(max-width:820px){
    body{padding:14px;}
    .board{grid-template-columns:1fr;}
    .move{opacity:1;}
    .langtog{position:static;margin-top:14px;width:fit-content;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="langtog">
      <button id="btn-en" class="on">EN</button><button id="btn-tr">TR</button>
    </div>
    <div class="eyebrow">Ahmed Shobaary &middot; Digital Solutions</div>
    <h1 id="h-title">Omnia Jewelry <span id="h-title2">&mdash; Project Board</span></h1>
    <div class="sub" id="h-sub"></div>
    <div class="bar-wrap">
      <div class="bar-top"><span id="progressLabel"></span><b id="progressPct">0%</b></div>
      <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    </div>
  </header>

  <div class="phases" id="phases"></div>
  <div class="hint" id="hint"></div>
  <div class="filters" id="filters"></div>

  <div class="board">
    <div class="col todo">
      <div class="col-head"><span class="col-title" id="l-todo"></span><span class="col-count" id="c-todo">0</span></div>
      <div id="todo"></div>
    </div>
    <div class="col doing">
      <div class="col-head"><span class="col-title" id="l-doing"></span><span class="col-count" id="c-doing">0</span></div>
      <div id="doing"></div>
    </div>
    <div class="col done">
      <div class="col-head"><span class="col-title" id="l-done"></span><span class="col-count" id="c-done">0</span></div>
      <div id="done"></div>
    </div>
  </div>

  <div class="foot">
    <span id="ownerkey"></span>
    <span style="display:flex;gap:8px;">
      <button class="reset" id="exportBtn" style="border-color:#c9cfda;"></button>
      <button class="reset" id="resetBtn"></button>
    </span>
  </div>

</div>

<script>
const TASKS = [
  {id:1, p:1, c:"crit", w:"client", blocked:true,
   en:"Contact page phone numbers are fake placeholder links",
   tr:"İletişim sayfası telefon numaraları hatalı bağlantı içeriyor"},
  {id:2, p:1, c:"crit", w:"client", blocked:true,
   en:"Contact page email links go to a wrong/old address",
   tr:"İletişim e-posta bağlantıları yanlış adrese gidiyor"},
  {id:3, p:1, c:"crit", w:"copy",
   en:'"Yodie" company name in the Terms & Conditions popup',
   tr:'Şartlar metninde başka bir firma adı ("Yodie") var'},
  {id:4, p:1, c:"crit", w:"copy",
   en:"Terms of Service page shows privacy content instead of terms",
   tr:"Şartlar sayfasında yanlış içerik gösteriliyor"},
  {id:5, p:1, c:"crit", w:"dev",
   en:"Empty category links in the menu lead to blank pages",
   tr:"Menüdeki boş kategoriler boş sayfalara yönlendiriyor"},
  {id:6, p:1, c:"crit", w:"dev",
   en:"Fake demo products on the homepage (Bracelets tab)",
   tr:"Ana sayfada örnek/demo ürünler görünüyor"},
  {id:7, p:1, c:"cat", w:"dev",
   en:'"Omnia Edge" earring mis-tagged as a ring',
   tr:'Bir küpe yanlışlıkla "yüzük" olarak etiketlenmiş'},
  {id:8, p:1, c:"cat", w:"dev",
   en:'"kopya" leftover in a product URL handle',
   tr:'Bir ürün adresinde "kopya" ifadesi kalmış'},
  {id:9, p:1, c:"cat", w:"dev",
   en:"Two products still have old Turkish URL handles",
   tr:"İki üründe eski Türkçe adresler var"},
  {id:10, p:1, c:"cont", w:"dev",
   en:'Broken image (code error) in the blog "About Us" post',
   tr:"Blog yazısında bozuk görsel (kod hatası)"},
  {id:11, p:1, c:"cont", w:"dev",
   en:'Misspelled blog author name ("Oumnia … Co. Co.")',
   tr:'Blog yazar adında yazım hatası ("Oumnia … Co. Co.")'},
  {id:12, p:1, c:"cont", w:"copy",
   en:'Nearly empty "Our Services" page',
   tr:'"Hizmetlerimiz" sayfası neredeyse boş'},
  {id:13, p:1, c:"cont", w:"dev",
   en:"Dead menu links (Design Atelier, Journal)",
   tr:"Menüde çalışmayan bağlantılar (Design Atelier, Journal)"},
  {id:14, p:1, c:"cont", w:"dev",
   en:'"The Maison" menu inconsistent (desktop vs mobile)',
   tr:'"The Maison" menüsü masaüstü/mobil tutarsız'},
  {id:15, p:1, c:"cont", w:"dev",
   en:"Dead footer links (Artists, Press, FAQ, Shipping…)",
   tr:"Alt bilgide çalışmayan bağlantılar (SSS, Kargo, Basın…)"},
  {id:16, p:1, c:"cont", w:"dev",
   en:'Broken "Home" link on every page',
   tr:'Her sayfada bozuk "Ana Sayfa" bağlantısı'},
  {id:17, p:1, c:"cont", w:"dev",
   en:"Wishlist icons link nowhere",
   tr:"Favori (wishlist) simgeleri çalışmıyor"},
  {id:18, p:1, c:"pol", w:"dev",
   en:'Outdated "© 2020" copyright',
   tr:'Güncel olmayan telif hakkı yılı ("© 2020")'},

  {id:19, p:2, c:"sys", w:"client", blocked:true,
   en:"Confirm the USD anchor price for each product",
   tr:"Her ürün için dolar bazlı fiyatın onaylanması"},
  {id:20, p:2, c:"sys", w:"dev",
   en:"Set up Shopify metafields to store each product's USD price",
   tr:"Ürün dolar fiyatı için Shopify metafield yapısının kurulması"},
  {id:21, p:2, c:"sys", w:"dev",
   en:"Enter the USD anchor price for all 31 products",
   tr:"31 ürün için dolar fiyatlarının girilmesi"},
  {id:22, p:2, c:"sys", w:"dev",
   en:"Connect a live USD/TRY exchange rate source (API)",
   tr:"Canlı dolar/TL kur kaynağının (API) bağlanması"},
  {id:23, p:2, c:"sys", w:"dev",
   en:"Build the price calculation with 50/100 TL rounding",
   tr:"50/100 TL yuvarlama ile fiyat hesaplamasının yazılması"},
  {id:24, p:2, c:"sys", w:"dev",
   en:"Add safety checks (skip update if the rate looks wrong)",
   tr:"Güvenlik kontrolleri (hatalı kur durumunda güncellemeyi atla)"},
  {id:25, p:2, c:"sys", w:"dev",
   en:"Deploy the daily automatic update (scheduled job)",
   tr:"Günlük otomatik güncellemenin (zamanlanmış görev) kurulması"},
  {id:26, p:2, c:"sys", w:"dev",
   en:"Test the system on a few sample products",
   tr:"Sistemin birkaç örnek ürün üzerinde test edilmesi"},
  {id:27, p:2, c:"sys", w:"dev",
   en:"Roll out across the full catalogue",
   tr:"Tüm katalogda devreye alınması"},
  {id:28, p:2, c:"sys", w:"dev",
   en:"Add update logging so changes can be reviewed",
   tr:"Güncelleme kayıtlarının (log) eklenmesi"}
];

const T = {
  en:{
    title2:"— Project Board",
    sub:"Website fixes and automatic pricing system · Approved project",
    hint:"Click a card to move it forward · use the arrows to move it back · progress saves automatically",
    hintClient:"Live status of the project · updated by the developer",
    todo:"To Do", doing:"In Progress", done:"Done",
    complete:(d,t)=>d+" of "+t+" complete",
    all:"All", crit:"Critical", cat:"Catalog", cont:"Content", pol:"Polish", sys:"System",
    p0:"All Work", p1:"Phase 1 · Website Fixes", p2:"Phase 2 · Pricing System",
    reset:"Reset", export:"Copy status for deploy", nothing:"Nothing here",
    key:'Owner key: <b>Developer</b> = build work · <b>Store Owner</b> = information needed · <b>Content</b> = text to be written',
    needs:"Needs ",
    owner:{dev:"Developer", client:"Omnia Owner", copy:"Content"}
  },
  tr:{
    title2:"— Proje Panosu",
    sub:"Web sitesi düzeltmeleri ve otomatik fiyatlandırma sistemi · Onaylanan proje",
    hint:"İlerletmek için karta tıklayın · geri almak için okları kullanın · ilerleme otomatik kaydedilir",
    hintClient:"Projenin güncel durumu · geliştirici tarafından güncellenir",
    todo:"Yapılacak", doing:"Devam Ediyor", done:"Tamamlandı",
    complete:(d,t)=>t+" işten "+d+" tamamlandı",
    all:"Tümü", crit:"Kritik", cat:"Katalog", cont:"İçerik", pol:"Detay", sys:"Sistem",
    p0:"Tüm İşler", p1:"1. Aşama · Site Düzeltmeleri", p2:"2. Aşama · Fiyatlandırma Sistemi",
    reset:"Sıfırla", export:"Durumu kopyala", nothing:"Burada bir şey yok",
    key:'Sorumlu: <b>Geliştirici</b> = yapım işi · <b>Mağaza Sahibi</b> = bilgi bekleniyor · <b>İçerik</b> = yazılacak metin',
    needs:"Bekleniyor: ",
    owner:{dev:"Geliştirici", client:"Omnia Sahibi", copy:"İçerik"}
  }
};

/* ============================================================
   DEPLOYED STATUS — the single source of truth for the client.
   Edit these values, then redeploy.  "todo" | "doing" | "done"
   ============================================================ */
const STATUS = {
  1:"todo",  2:"todo",  3:"todo",  4:"todo",  5:"todo",  6:"todo",  7:"todo",
  8:"todo",  9:"todo", 10:"todo", 11:"todo", 12:"todo", 13:"todo", 14:"todo",
 15:"todo", 16:"todo", 17:"todo", 18:"todo", 19:"todo", 20:"todo", 21:"todo",
 22:"todo", 23:"todo", 24:"todo", 25:"todo", 26:"todo", 27:"todo", 28:"todo"
};

/* Client view = read-only.  Add ?view=client to the URL,
   or set FORCE_CLIENT = true to lock the deployed copy. */
const FORCE_CLIENT = false;
const CLIENT = FORCE_CLIENT ||
  new URLSearchParams(location.search).get("view") === "client";

const CATS = {crit:"t-crit", cat:"t-cat", cont:"t-cont", pol:"t-pol", sys:"t-sys"};
const COLS = ["todo","doing","done"];
const KEY  = "omnia_project_board_v2";

let state={}, filter="all", phase=0, lang="en";

const store = {
  async get(k){
    try{ if(window.storage){ const r=await window.storage.get(k); return r&&r.value?r.value:null; } }catch(e){}
    try{ return window.localStorage.getItem(k); }catch(e){}
    return null;
  },
  async set(k,v){
    try{ if(window.storage){ await window.storage.set(k,v); return; } }catch(e){}
    try{ window.localStorage.setItem(k,v); }catch(e){}
  }
};

async function load(){
  TASKS.forEach(t=>state[t.id]=STATUS[t.id]||"todo");
  if(CLIENT){ render(); return; }
  const raw = await store.get(KEY);
  if(raw){
    try{
      const s=JSON.parse(raw);
      Object.keys(s).forEach(k=>{ if(COLS.includes(s[k])) state[k]=s[k]; });
    }catch(e){}
  }
  render();
}
async function save(){ await store.set(KEY, JSON.stringify(state)); }

function move(id,d){
  const i=COLS.indexOf(state[id]);
  state[id]=COLS[Math.max(0,Math.min(2,i+d))];
  save(); render();
}

function visible(){
  return TASKS.filter(t =>
    (phase===0 || t.p===phase) &&
    (filter==="all" || t.c===filter)
  );
}
function scope(){ return TASKS.filter(t => phase===0 || t.p===phase); }

function buildPhases(){
  const L=T[lang], box=document.getElementById("phases");
  box.innerHTML="";
  [[0,L.p0],[1,L.p1],[2,L.p2]].forEach(([v,l])=>{
    const n=TASKS.filter(t=>v===0||t.p===v);
    const d=n.filter(t=>state[t.id]==="done").length;
    const b=document.createElement("button");
    b.className="ptab"+(phase===v?" on":"");
    b.innerHTML=l+'<span class="mini">'+d+" / "+n.length+"</span>";
    b.onclick=()=>{phase=v;filter="all";render();};
    box.appendChild(b);
  });
}

function buildFilters(){
  const L=T[lang], box=document.getElementById("filters");
  box.innerHTML="";
  const present=[...new Set(scope().map(t=>t.c))];
  [["all",L.all],...present.map(c=>[c,L[c]])].forEach(([v,l])=>{
    const n = v==="all" ? scope().length : scope().filter(t=>t.c===v).length;
    const b=document.createElement("button");
    b.className="chip"+(filter===v?" on":"");
    b.textContent=l+" ("+n+")";
    b.onclick=()=>{filter=v;render();};
    box.appendChild(b);
  });
}

function card(t){
  const L=T[lang], done=state[t.id]==="done";
  const d=document.createElement("div");
  d.className="card p-"+t.c+(done?" is-done":"");
  if(!CLIENT) d.onclick=e=>{ if(!e.target.closest(".move")) move(t.id,1); };
  else d.style.cursor="default";
  d.innerHTML=
    '<div class="card-num">#'+t.id+'</div>'+
    '<div class="card-title">'+t[lang]+'</div>'+
    '<div class="tags">'+
      '<span class="tag '+CATS[t.c]+'">'+L[t.c]+'</span>'+
      '<span class="who'+(t.blocked?' blocked':'')+'">'+(t.blocked?L.needs:'')+L.owner[t.w]+'</span>'+
    '</div>'+
    (CLIENT?'':'<div class="move">'+
      '<button data-d="-1">&#8592;</button><button data-d="1">&#8594;</button>'+
    '</div>');
  d.querySelectorAll(".move button").forEach(b=>{
    b.onclick=e=>{e.stopPropagation();move(t.id,+b.dataset.d);};
  });
  return d;
}

function render(){
  const L=T[lang];
  document.documentElement.lang = lang;
  document.getElementById("h-title2").innerHTML=L.title2;
  document.getElementById("h-sub").textContent=L.sub;
  document.getElementById("hint").textContent = CLIENT ? L.hintClient : L.hint;
  document.getElementById("l-todo").textContent=L.todo;
  document.getElementById("l-doing").textContent=L.doing;
  document.getElementById("l-done").textContent=L.done;
  document.getElementById("resetBtn").textContent=L.reset;
  document.getElementById("exportBtn").textContent=L.export;
  if(CLIENT){
    document.getElementById("resetBtn").style.display="none";
    document.getElementById("exportBtn").style.display="none";
  }
  document.getElementById("ownerkey").innerHTML=L.key;
  document.getElementById("btn-en").className = lang==="en"?"on":"";
  document.getElementById("btn-tr").className = lang==="tr"?"on":"";

  buildPhases(); buildFilters();

  const shown=visible();
  COLS.forEach(c=>{
    const box=document.getElementById(c);
    box.innerHTML="";
    const items=shown.filter(t=>state[t.id]===c);
    items.forEach(t=>box.appendChild(card(t)));
    if(!items.length){
      const e=document.createElement("div");
      e.className="empty"; e.textContent=L.nothing;
      box.appendChild(e);
    }
    document.getElementById("c-"+c).textContent=scope().filter(t=>state[t.id]===c).length;
  });

  const sc=scope(), done=sc.filter(t=>state[t.id]==="done").length;
  const pct=sc.length?Math.round(done/sc.length*100):0;
  document.getElementById("barFill").style.width=pct+"%";
  document.getElementById("progressPct").textContent=pct+"%";
  document.getElementById("progressLabel").textContent=L.complete(done,sc.length);
}

document.getElementById("btn-en").onclick=()=>{lang="en";render();};
document.getElementById("btn-tr").onclick=()=>{lang="tr";render();};
document.getElementById("exportBtn").onclick=()=>{
  const lines = TASKS.map(t=>' '+String(t.id).padStart(2)+':"'+state[t.id]+'"');
  let out="const STATUS = {\n";
  for(let i=0;i<lines.length;i+=7) out += lines.slice(i,i+7).join(",")+",\n";
  out = out.replace(/,\n$/,"\n")+"};";
  navigator.clipboard.writeText(out).then(()=>{
    const b=document.getElementById("exportBtn"), o=b.textContent;
    b.textContent="✓ Copied"; setTimeout(()=>b.textContent=o,1600);
  }).catch(()=>{ prompt("Copy this into the file:", out); });
};

document.getElementById("resetBtn").onclick=()=>{
  TASKS.forEach(t=>state[t.id]=STATUS[t.id]||"todo"); save(); render();
};

load();
</script>
</body>
</html>
